name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: career
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U postgres -d career"
          --health-interval=10s --health-timeout=5s --health-retries=5
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s --health-timeout=5s --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Django checks and migrations
        working-directory: backend
        env:
          DJANGO_DEBUG: 'True'
          DJANGO_SECRET_KEY: ci-only-secret-key
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/career
          REDIS_URL: redis://127.0.0.1:6379/0
        run: |
          python manage.py check
          python manage.py migrate --noinput
          python manage.py test --verbosity 1
      - name: Matching quality benchmark
        working-directory: backend
        env:
          DJANGO_DEBUG: 'True'
          DJANGO_SECRET_KEY: ci-only-secret-key
        run: python manage.py test_matching
      - name: API performance baseline
        working-directory: backend
        env:
          DJANGO_DEBUG: 'True'
          DJANGO_SECRET_KEY: ci-only-secret-key
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/career
        run: python manage.py measure_api_performance --runs 10

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build
