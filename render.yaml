services:
  - type: web
    name: ai-career-copilot
    runtime: python
    plan: free

    buildCommand: |
      pip install -r backend/requirements.txt
      npm --prefix frontend install
      npm --prefix frontend run build
      rm -rf backend/frontend_dist
      mkdir -p backend/frontend_dist
      cp -r frontend/dist/. backend/frontend_dist/
      cd backend && python manage.py collectstatic --noinput

    startCommand: cd backend && python manage.py migrate && exec gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120 --access-logfile - --error-logfile -

    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true

      - key: DJANGO_DEBUG
        value: "False"

      - key: ALLOWED_HOSTS
        value: ".onrender.com"

      - key: CELERY_TASK_ALWAYS_EAGER
        value: "True"

      - key: DATABASE_URL
        fromDatabase:
          name: ai-career-copilot-db
          property: connectionString

      - key: OPENAI_API_KEY
        sync: false

databases:
  - name: ai-career-copilot-db
    databaseName: ai_career_copilot
    user: ai_career_copilot
    plan: free